[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skillguard-engine"
version = "0.1.0"
description = "Static security analysis engine for SkillGuard"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["python/skillguard_engine"]

[tool.hatch.build.targets.wheel.force-include]
"packages/protocol/schema" = "skillguard_engine/protocol/schema"
"packages/protocol/rules" = "skillguard_engine/security/catalog"

[tool.hatch.build.targets.sdist]
include = ["/python/skillguard_engine", "/python/tests", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.sdist.force-include]
"packages/protocol/schema" = "packages/protocol/schema"
"packages/protocol/rules" = "packages/protocol/rules"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["python/tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]
include = ["pyproject.toml", "python/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["python/skillguard_engine", "python/tests"]
strict = true
warn_unreachable = true
