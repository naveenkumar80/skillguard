name: SkillGuard

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.11"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check repository hygiene
        run: node scripts/check-hygiene.mjs

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28

      - name: Install JavaScript dependencies from lockfile
        run: npx --yes pnpm@9.15.0 install --frozen-lockfile

      - name: Install Python dependencies from lockfile
        run: uv sync --locked

      - name: Build SkillGuard packages
        run: npx --yes pnpm@9.15.0 -r build

      - name: Dogfooding - Check example greeting skill
        id: greeting-check
        uses: ./.github/actions/skillguard
        with:
          command: check
          path: examples/greeting
          format: sarif
          sarif-file: results-greeting.sarif

      - name: Assert example greeting SARIF outputs
        shell: bash
        env:
          ACTUAL_EXIT: ${{ steps.greeting-check.outputs.exit-code }}
          SARIF_VALID: ${{ steps.greeting-check.outputs.sarif-valid }}
          SARIF_HAS_RESULTS: ${{ steps.greeting-check.outputs.sarif-has-results }}
        run: |
          if [ "$ACTUAL_EXIT" != "0" ] || [ "$SARIF_VALID" != "true" ] || [ "$SARIF_HAS_RESULTS" != "false" ]; then
            echo "Unexpected greeting-check outputs: exit=$ACTUAL_EXIT valid=$SARIF_VALID results=$SARIF_HAS_RESULTS" >&2
            exit 1
          fi

      - name: Dogfooding - Scan example greeting skill
        uses: ./.github/actions/skillguard
        with:
          command: scan
          path: examples/greeting
          format: terminal

      - name: Dogfooding - Test example greeting recorded fixtures
        uses: ./.github/actions/skillguard
        with:
          command: test
          path: examples/greeting
          format: terminal

      - name: Dogfooding - Check valid dogfooding fixture
        id: valid-skill-check
        uses: ./.github/actions/skillguard
        with:
          command: check
          path: tests/fixtures/dogfooding/valid-skill
          format: sarif
          sarif-file: results-valid.sarif

      - name: Dogfooding - Negative check on invalid-spec fixture (expect exit 1)
        id: neg-invalid-spec
        continue-on-error: true
        uses: ./.github/actions/skillguard
        with:
          command: check
          path: tests/fixtures/dogfooding/invalid-spec
          format: sarif
          sarif-file: results-invalid-spec.sarif

      - name: Assert invalid-spec fails with exit code 1 and valid SARIF findings
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.neg-invalid-spec.outcome }}
          ACTUAL_EXIT: ${{ steps.neg-invalid-spec.outputs.exit-code }}
          SARIF_VALID: ${{ steps.neg-invalid-spec.outputs.sarif-valid }}
          SARIF_HAS_RESULTS: ${{ steps.neg-invalid-spec.outputs.sarif-has-results }}
        run: |
          if [ "$STEP_OUTCOME" != "failure" ] || [ "$ACTUAL_EXIT" != "1" ] || [ "$SARIF_VALID" != "true" ] || [ "$SARIF_HAS_RESULTS" != "true" ]; then
            echo "Expected failure exit 1 with valid SARIF findings for invalid-spec; got outcome=$STEP_OUTCOME exit=$ACTUAL_EXIT valid=$SARIF_VALID results=$SARIF_HAS_RESULTS" >&2
            exit 1
          fi

      - name: Dogfooding - Negative scan on sec-high fixture (expect exit 1)
        id: neg-sec-high
        continue-on-error: true
        uses: ./.github/actions/skillguard
        with:
          command: scan
          path: tests/fixtures/dogfooding/sec-high
          format: terminal

      - name: Assert sec-high fails with exit code 1
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.neg-sec-high.outcome }}
          ACTUAL_EXIT: ${{ steps.neg-sec-high.outputs.exit-code }}
        run: |
          if [ "$STEP_OUTCOME" != "failure" ] || [ "$ACTUAL_EXIT" != "1" ]; then
            echo "Expected failure exit 1 for sec-high; got outcome=$STEP_OUTCOME exit=$ACTUAL_EXIT" >&2
            exit 1
          fi

      - name: Dogfooding - Verify severity-threshold gating on medium finding (high threshold expects exit 0)
        id: pos-sec-med-high
        uses: ./.github/actions/skillguard
        with:
          command: scan
          path: tests/fixtures/dogfooding/sec-medium
          format: terminal
          severity-threshold: high

      - name: Dogfooding - Negative scan on sec-medium with medium threshold (expect exit 1)
        id: neg-sec-med-medium
        continue-on-error: true
        uses: ./.github/actions/skillguard
        with:
          command: scan
          path: tests/fixtures/dogfooding/sec-medium
          format: terminal
          severity-threshold: medium

      - name: Assert sec-medium fails with exit code 1 at medium threshold
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.neg-sec-med-medium.outcome }}
          ACTUAL_EXIT: ${{ steps.neg-sec-med-medium.outputs.exit-code }}
        run: |
          if [ "$STEP_OUTCOME" != "failure" ] || [ "$ACTUAL_EXIT" != "1" ]; then
            echo "Expected failure exit 1 for sec-medium at medium threshold; got outcome=$STEP_OUTCOME exit=$ACTUAL_EXIT" >&2
            exit 1
          fi

      - name: Dogfooding - Negative test run on failing-tests fixture (expect exit 1)
        id: neg-failing-tests
        continue-on-error: true
        uses: ./.github/actions/skillguard
        with:
          command: test
          path: tests/fixtures/dogfooding/failing-tests
          format: terminal

      - name: Assert failing-tests fails with exit code 1
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.neg-failing-tests.outcome }}
          ACTUAL_EXIT: ${{ steps.neg-failing-tests.outputs.exit-code }}
        run: |
          if [ "$STEP_OUTCOME" != "failure" ] || [ "$ACTUAL_EXIT" != "1" ]; then
            echo "Expected failure exit 1 for failing-tests; got outcome=$STEP_OUTCOME exit=$ACTUAL_EXIT" >&2
            exit 1
          fi

      - name: Upload validated SARIF workflow artifact for trusted branch upload
        if: >-
          matrix.os == 'ubuntu-latest' &&
          steps.greeting-check.outputs.sarif-valid == 'true' &&
          github.repository == 'naveenkumar80/skillguard' &&
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillguard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: results-greeting.sarif
          retention-days: 7
          if-no-files-found: error

  upload-sarif:
    name: Upload SARIF to GitHub Code Scanning
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    if: >-
      github.repository == 'naveenkumar80/skillguard' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download validated SARIF artifact from current workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skillguard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: sarif-upload

      - name: Upload SARIF results to Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: sarif-upload/results-greeting.sarif
          category: skillguard-greeting
