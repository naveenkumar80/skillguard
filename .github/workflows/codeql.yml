name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEQL_ACTION_DEBUG_COMBINED_SARIF: "false"
      CODEQL_OVERLAY_DATABASE_MODE: none
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Refuse debug reruns that would upload diagnostic artifacts
        if: ${{ runner.debug == '1' }}
        run: |
          printf '%s\n' 'Rerun without debug logging; CodeQL debug mode uploads reports and databases.'
          exit 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          debug: false
          dependency-caching: false
          trap-caching: false
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/.venv/**'
              - '**/dist/**'
      - name: Analyze without uploading results or databases
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
